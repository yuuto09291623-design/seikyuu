<style>
:root{
  --bg:#e9ebef; --panel:#fff; --ink:#1d2430; --sub:#677182; --line:#d4d9e1;
  --navy:#27344d; --navyD:#1a2436; --red:#b23b32; --redD:#8d2c24; --field:#f6f7f9; --focus:#3a4d72;
  --sans:'Noto Sans JP',-apple-system,BlinkMacSystemFont,'Hiragino Kaku Gothic ProN','Yu Gothic','Meiryo',sans-serif;
  --mincho:'Noto Serif JP','Hiragino Mincho ProN','Yu Mincho','YuMincho','MS PMincho',serif;
}
*{box-sizing:border-box;-webkit-font-smoothing:antialiased;}
html{-webkit-text-size-adjust:100%;}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);}
input,select,textarea{font-size:16px;font-family:inherit;}
input::placeholder,textarea::placeholder{color:#aab1bd;}
button{font-family:inherit;touch-action:manipulation;-webkit-tap-highlight-color:transparent;cursor:pointer;}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#c5cad3;border-radius:8px;border:2px solid var(--bg)}
input[type=checkbox]{accent-color:var(--navy);width:20px;height:20px}

.btn{padding:10px 16px;min-height:42px;font-size:14px;font-weight:600;border:none;border-radius:10px;color:#fff;white-space:nowrap;transition:filter .15s,transform .05s;}
.btn:active{transform:translateY(1px)}
.btn:hover{filter:brightness(.93)}
.btn-ghost{background:#fff;color:var(--navy);border:1px solid var(--line)}
.btn-navy{background:var(--navyD)} .btn-red{background:var(--red)} .btn-primary{background:var(--navy)}

/* header */
.header{position:sticky;top:0;z-index:30;background:var(--navy);color:#fff;padding:12px 18px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;box-shadow:0 2px 10px rgba(0,0,0,.12)}
.h-brand{display:flex;align-items:center;gap:11px}
.h-logo{width:30px;height:30px;border-radius:7px;background:var(--red);display:grid;place-items:center;font-size:15px;font-weight:700}
.h-title{font-size:15px;font-weight:700;letter-spacing:.5px}
.h-sub{font-size:10.5px;opacity:.65}
.hbtns{display:flex;gap:8px;flex-wrap:wrap}

/* tabbar (narrow only) */
.tabbar{display:none}

/* layout */
.main{display:flex;flex-direction:row;gap:18px;padding:16px;align-items:flex-start;max-width:1500px;margin:0 auto}
.panel-form{flex:0 0 480px;max-width:480px;min-width:0}
.panel-preview{flex:1;min-width:0;position:sticky;top:76px}

/* sections */
.sec{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 16px 18px;margin-bottom:14px}
.sec-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:13px}
.sec-tt{display:flex;align-items:center;gap:8px}
.sec-tt .bar{width:3px;height:15px;background:var(--red);border-radius:2px}
.sec-tt h3{margin:0;font-size:14px;font-weight:700}
.lbl{font-size:12px;font-weight:600;color:var(--sub);margin-bottom:5px;display:block;letter-spacing:.2px}
.inp{width:100%;padding:11px 12px;font-size:16px;border:1px solid var(--line);border-radius:9px;background:var(--field);color:var(--ink);outline:none;-webkit-appearance:none;transition:border-color .15s,background .15s}
.inp:focus{border-color:var(--focus);background:#fff}
.row{display:flex;gap:10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* presets */
.presets{display:flex;flex-wrap:wrap;gap:8px}
.preset{padding:8px 13px;font-size:13px;font-weight:600;border-radius:20px;border:1px solid var(--line);background:#f3f5f8;color:var(--navy)}
.preset.nontax{border-color:#e3c9c6;background:#fbeeec;color:var(--redD)}

/* items */
.itemsList{display:flex;flex-direction:column;gap:10px}
.empty{text-align:center;color:var(--sub);font-size:12.5px;padding:18px 0;border:1px dashed var(--line);border-radius:10px}
.item{border:1px solid var(--line);border-radius:10px;padding:11px;background:#fff}
.item.nontax{background:#fdf4f3}
.item .r1{display:flex;gap:8px;margin-bottom:8px}
.item .r1 .n{flex:2}.item .r1 .nt{flex:1}
.item .r1 .inp{font-weight:600}
.fields{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end}
.fld{display:flex;flex-direction:column}
.fld .l{font-size:12px;font-weight:600;color:var(--sub);margin-bottom:3px}
.fld .inp{text-align:right}
.fld.qty{flex:0 0 70px}.fld.unit{flex:0 0 64px}.fld.unit .inp{text-align:center}
.fld.money{flex:1 1 90px;min-width:84px}
.ctrl{display:flex;align-items:center;justify-content:space-between;margin-top:12px}
.chk{display:flex;align-items:center;gap:7px;font-size:13.5px;font-weight:600;color:var(--navy);padding:6px 4px;cursor:pointer}
.chk.nontax{color:var(--redD)}
.ctrl .ops{display:flex;gap:6px}
.opbtn{padding:8px 13px;min-width:44px;min-height:42px;font-size:14px;font-weight:600;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--navy)}
.opbtn:disabled{opacity:.4}
.delbtn{padding:8px 14px;color:var(--red);border-color:#e8cbc8}
.delbtn:hover{background:#fbeae8;color:var(--redD)}
.addbtn{width:100%;margin-top:12px;padding:11px;border:1px dashed var(--line);border-radius:10px;background:#fff;color:var(--navy);font-size:14px;font-weight:600}

/* totals box */
.totbox{margin-top:14px;background:#f2f4f7;border-radius:10px;padding:12px 14px;font-size:13px}
.totrow{display:flex;justify-content:space-between;padding:2px 0;color:#3a4150}
.totrow b{font-weight:600;font-variant-numeric:tabular-nums}
.tothr{height:1px;background:var(--line);margin:8px 0}
.totgrand{display:flex;justify-content:space-between;align-items:baseline}
.totgrand .lab{font-weight:700}
.totgrand .val{font-weight:800;font-size:19px;color:var(--red)}

/* preview */
.pv-bar{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;gap:8px;flex-wrap:wrap}
.pv-bar .lbl-min{font-size:12px;color:var(--sub)}
.pv-tools{display:flex;align-items:center;gap:6px}
.zbtn{padding:6px 12px;min-height:36px;font-size:14px;font-weight:600;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--navy)}
.zpct{font-size:12.5px;font-weight:600;min-width:62px;text-align:center}
.preview-clip{overflow:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;background:#cfd4dd;border-radius:8px;padding:12px;max-height:calc(100vh - 130px)}
.preview-sizer{position:relative;margin:0 auto}
.preview-inner{position:absolute;top:0;left:0;transform-origin:top left;width:210mm;box-shadow:0 6px 28px rgba(20,30,50,.25)}

/* modal + toast */
.overlay{position:fixed;inset:0;background:rgba(20,28,45,.45);z-index:50;display:grid;place-items:center;padding:20px}
.modal{background:#fff;border-radius:14px;width:min(560px,100%);max-height:80vh;overflow:auto;padding:20px}
.modal-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.modal-h h3{margin:0;font-size:16px;font-weight:700}
.inv-list{display:flex;flex-direction:column;gap:8px}
.inv-item{border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.inv-item .nm{font-weight:700;font-size:14px}
.inv-item .mt{font-size:12px;color:var(--sub)}
.inv-item .acts{display:flex;gap:6px;flex-shrink:0}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:60;background:var(--navyD);color:#fff;padding:11px 20px;border-radius:10px;font-size:13px;font-weight:600;box-shadow:0 6px 20px rgba(0,0,0,.25);opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}
.toast.err{background:var(--redD)}

/* ===== invoice document ===== */
.iv{width:210mm;min-height:297mm;background:#fff;color:#15191f;font-family:var(--mincho);font-size:9.5pt;line-height:1.3;padding:10mm 9mm 8mm}
.iv .cell{border-right:1px solid #2a2f37;padding:0 2mm;display:flex;align-items:center;font-size:9.2pt;min-width:0;overflow:hidden;white-space:nowrap}
.iv .cell.r{justify-content:flex-end;font-variant-numeric:tabular-nums}
.iv .cell.c{justify-content:center}
.iv .cell.last{border-right:none}
.iv .g7{display:grid;grid-template-columns:44mm 22mm 12mm 12mm 22mm 24mm 22mm}
.iv .gv{display:grid;grid-template-columns:24mm 28mm 24mm 28mm 30mm 24mm 1fr}
.iv .rh{height:6.6mm;border-bottom:1px dashed #aeb4bd}

/* responsive: tablet / phone */
@media (max-width:1079px){
  .main{flex-direction:column}
  .panel-form{flex:1 1 auto;width:100%;max-width:100%}
  .panel-preview{flex:1 1 auto;width:100%;max-width:100%;position:static}
  .tabbar{display:block;position:sticky;top:58px;z-index:25;background:var(--bg);padding:10px 14px 0}
  .tabbar .seg{display:flex;gap:6px;background:#dfe3ea;padding:5px;border-radius:12px}
  .tabbar .tab{flex:1;min-height:42px;border:none;border-radius:9px;font-size:14px;font-weight:700;background:transparent;color:#6b7585}
  .tabbar .tab.active{background:#fff;color:var(--navy);box-shadow:0 1px 4px rgba(0,0,0,.12)}
  .main[data-tab="form"] .panel-preview{display:none}
  .main[data-tab="preview"] .panel-form{display:none}
  .preview-clip{max-height:calc(100vh - 215px)}
}

/* print */
.print-only{display:none}
@page{size:A4;margin:0}
@media print{
  .screen{display:none!important}
  .print-only{display:block!important}
  html,body{background:#fff!important;margin:0!important}
}
</style>

<body>

          </div>

          <div style="flex:1"><label class="lbl">日</label><input class="inp" id="dd" inputmode="numeric" style="text-align:right"></div>

            <div style="flex:1"><label class="lbl">社名(和)</label><input class="inp" id="c_nameJa"></div>

            <div style="flex:1"><label class="lbl">TEL/FAX</label><input class="inp" id="c_tel"></div>

          <div><label class="lbl">振込先</label><input class="inp" id="c_bank"></div>
          <div class="row" style="align-items:flex-end">
            <div style="flex:0 0 120px"><label class="lbl">消費税率(%)</label><input class="inp" id="c_taxRate" inputmode="numeric" style="text-align:right"></div>
            <button class="btn btn-primary" id="btnSaveCompany" style="flex:1">この内容を既定として保存</button>
          </div>
        </div>
      </div>
      <div style="height:20px"></div>

        </div>
      </div>
    </div>
  </div>
</div>

<script>
/* ============== ユーティリティ ============== */
function num(v){ if(typeof v==='number') return isNaN(v)?0:v; var n=parseFloat(String(v==null?'':v).replace(/[^0-9.\-]/g,'')); return isNaN(n)?0:n; }
function fmt(n){ return Math.round(num(n)).toLocaleString('ja-JP'); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
function uid(){ return Math.random().toString(36).slice(2); }
function todayReiwa(){ var d=new Date(); return {era:'令和', year:d.getFullYear()-2018, month:d.getMonth()+1, day:d.getDate()}; }
var LS_INV='upmoon_inv:', LS_CO='upmoon_company_default';

/* ============== 既定データ ============== */

  service:'新車・中古車販売・車検・修理・鈑金塗装・買取',
  agency:'三井住友海上火災保険代理店',
  nameEn:'UP MOON AUTO', nameJa:'アップムーンオート', rep:'代表　上月敏昭',
  zip:'630-8106', address:'奈良県奈良市佐保台西町204', tel:'tel/fax 0742-71-6192',
  regNo:'T7810019890837',
  bank:'（振込先）南都銀行/手貝（テガイ）支店　普通　281854　アップムーンオート　ウエヅキトシアキ',
  taxRate:10
};
var PRESETS=[
  ['自動車重量税','自動車重量税','',false],['検査手数料','検査手数料','',false],
  ['自賠責保険','自賠責保険','24カ月',false],['印紙代','印紙代','',false],
  ['検査代行費','検査代行費','',true],['完成検査料','完成検査料','',true],
  ['24ヶ月点検','24ヶ月点検','',true],
  ['ヘッドライト・サイドスリップ','ヘッドライト・サイドスリップ','点検・調整',true],
  ['エンジンオイル','エンジンオイル','交換',true],['オイルエレメント','オイルエレメント','交換',true],

  ['バッテリー','バッテリー','交換',true],['LLC','LLC（クーラント）','交換',true],

];
function blankItem(o){ return Object.assign({id:uid(),name:'',note:'',qty:1,unit:'',unitPrice:0,partsPrice:0,labor:0,taxable:true}, o||{}); }
function sampleInvoice(){

    slipNo:'1816', page:'1/1', era:'令和', year:8, month:6, day:2,

      blankItem({name:'検査手数料',qty:1,unitPrice:2500,partsPrice:2500,taxable:false}),

    ]
  };

/* ============== 計算 ============== */
function calcTotals(items, taxRate){
  var parts=0,labor=0,tb=0;
  for(var i=0;i<items.length;i++){ var p=num(items[i].partsPrice),l=num(items[i].labor); parts+=p; labor+=l; if(items[i].taxable) tb+=p+l; }
  var beforeTax=parts+labor, tax=Math.floor(tb*num(taxRate)/100);
  return {parts:parts,labor:labor,beforeTax:beforeTax,tax:tax,total:beforeTax+tax,taxableBase:tb};
}

/* ============== 状態 ============== */
function blankInvoice(){
  var tr=todayReiwa();
  return { slipNo:'', page:'1/1', era:tr.era, year:tr.year, month:tr.month, day:tr.day,

}

/* ============== 請求書HTML生成 ============== */

      +'<div class="cell r last">'+(num(it.labor)?fmt(it.labor):'')+'</div></div>';
  }
  function totRow(label,val,bold){
    return '<div class="g7 rh"><div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div>'
      +'<div class="cell c" style="font-weight:600">'+label+'</div>'

      +'<div class="cell r last">'+(label==='－計－'?fmt(t.labor):'')+'</div></div>';
  }
  var fill=Math.max(0, 11-d.items.length), fillRows='';
  for(var f=0;f<fill;f++) fillRows+='<div class="g7 rh"><div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell last"></div></div>';

  return ''
  +'<div class="iv">'

      +'<div style="flex:1.25;display:flex;flex-direction:column">'

          +'<span style="font-size:16pt;font-weight:600">'+(esc(d.customer)||'&nbsp;')+'</span>'
          +'<span style="font-size:13pt;margin-left:5mm">様</span></div>'
      +'</div>'
      +'<div style="flex:1;display:flex;flex-direction:column;align-items:flex-end;text-align:right">'
        +'<div style="font-size:10pt;margin-bottom:1mm">伝票<span style="font-size:8.5pt">No.</span> <span style="border-bottom:1px dotted #555;padding:0 3mm">'+esc(d.slipNo)+'</span><span style="margin-left:4mm">Page '+esc(d.page)+'</span></div>'
        +'<div style="font-size:11pt;font-weight:600;border-bottom:1px dotted #555;padding-bottom:.5mm;margin-bottom:1.5mm">'+esc(d.era)+' '+esc(d.year)+'年 '+esc(d.month)+'月 '+esc(d.day)+'日</div>'
        +'<div style="font-size:7.4pt;letter-spacing:.2px">'+esc(c.service)+'</div>'
        +'<div style="font-size:7.6pt;letter-spacing:1px">'+esc(c.agency)+'</div>'
        +'<div style="font-size:11.5pt;font-weight:700;letter-spacing:1px;margin-top:.5mm">'+esc(c.nameEn)+'</div>'
        +'<div style="font-size:9pt;font-weight:600">'+esc(c.nameJa)+'</div>'
        +'<div style="font-size:8.5pt">'+esc(c.rep)+'</div>'
        +'<div style="font-size:8pt;margin-top:.3mm">〒'+esc(c.zip)+'</div>'
        +'<div style="font-size:8pt">'+esc(c.address)+'</div>'
        +'<div style="font-size:8pt">'+esc(c.tel)+'　<span style="letter-spacing:.3px">'+esc(c.regNo)+'</span></div>'
        +'<div style="display:flex;gap:1.5mm;margin-top:1.5mm">'+stamps+'</div>'
      +'</div>'
    +'</div>'
    /* 請求金額 */
    +'<div style="margin-top:4mm;display:flex"><div style="display:flex;align-items:stretch;border:1.4px solid #2a2f37;border-radius:2mm;overflow:hidden;width:108mm;height:12mm">'
      +'<div style="display:flex;align-items:center;padding:0 4mm;font-size:11pt;font-weight:600;border-right:1.4px solid #2a2f37">ご請求金額</div>'
      +'<div style="flex:1;display:flex;align-items:center;padding:0 5mm;font-size:15pt;font-weight:700;font-variant-numeric:tabular-nums">¥'+fmt(t.total)+'-</div></div></div>'
    /* 車両情報 */
    +'<div style="margin-top:3mm;border:1.3px solid #2a2f37;border-radius:2mm;overflow:hidden">'
      +'<div class="gv" style="border-bottom:1px solid #2a2f37">'
        +'<div class="cell c" style="height:7mm;font-weight:600;font-size:8.6pt">登録番号</div>'

      +'<div class="gv">'
        +'<div class="cell c" style="height:7.5mm">'+esc(d.vehicle.reg)+'</div>'
        +'<div class="cell c" style="height:7.5mm">'+esc(d.vehicle.name)+'</div>'
        +'<div class="cell c" style="height:7.5mm">'+esc(d.vehicle.model)+'</div>'

        +'<div class="cell c" style="height:7.5mm">'+esc(d.vehicle.chassis)+'</div>'

    +'</div>'
    /* 明細 */
    +'<div style="margin-top:3mm;border:1.4px solid #2a2f37">'
      +'<div class="g7" style="border-bottom:1.2px solid #2a2f37">'
        +'<div class="cell"></div><div class="cell"></div>'
        +'<div class="cell c" style="height:7mm;font-weight:600">数量</div>'
        +'<div class="cell c" style="font-weight:600">単位</div>'
        +'<div class="cell c" style="font-weight:600">単価</div>'
        +'<div class="cell c" style="font-weight:600">部品価格</div>'
        +'<div class="cell c last" style="font-weight:600">技術料</div></div>'
      +itemRows
      +totRow('－計－',fmt(t.parts),false)
      +totRow('税抜計',fmt(t.beforeTax),false)
      +totRow('消費税',fmt(t.tax),false)
      +totRow('総合計',fmt(t.total),true)
      +fillRows
    +'</div>'
    /* 下部サマリー */
    +'<div style="margin-top:3mm;display:grid;grid-template-columns:66mm 1fr">'
      +'<div style="border:1.3px solid #2a2f37;border-right:none;display:grid;grid-template-rows:1fr 1fr">'
        +'<div style="display:grid;grid-template-columns:1fr 1fr 1fr"><div style="border-right:1px solid #2a2f37"></div><div style="border-right:1px solid #2a2f37"></div><div></div></div>'
        +'<div style="display:grid;grid-template-columns:1fr 1fr 1fr;border-top:1px solid #2a2f37"><div style="border-right:1px solid #2a2f37"></div><div style="border-right:1px solid #2a2f37"></div><div></div></div></div>'
      +'<div style="border:1.3px solid #2a2f37;display:grid;grid-template-rows:1fr 1fr">'
        +'<div style="display:grid;grid-template-columns:1fr 1fr 1fr 1fr 1.1fr;border-bottom:1px solid #2a2f37">'
          +'<div class="cell c" style="height:7mm;font-weight:600;font-size:8.6pt">部品等計</div>'
          +'<div class="cell c" style="height:7mm;font-weight:600;font-size:8.6pt">技術料</div>'
          +'<div class="cell c" style="height:7mm;font-weight:600;font-size:8.6pt">税抜計</div>'
          +'<div class="cell c" style="height:7mm;font-weight:600;font-size:8.6pt">消費税</div>'
          +'<div class="cell c last" style="height:7mm;font-weight:600;font-size:8.6pt">総合計</div></div>'
        +'<div style="display:grid;grid-template-columns:1fr 1fr 1fr 1fr 1.1fr">'
          +'<div class="cell r" style="height:8mm;font-size:9.6pt">'+fmt(t.parts)+'</div>'
          +'<div class="cell r" style="height:8mm;font-size:9.6pt">'+fmt(t.labor)+'</div>'
          +'<div class="cell r" style="height:8mm;font-size:9.6pt">'+fmt(t.beforeTax)+'</div>'
          +'<div class="cell r" style="height:8mm;font-size:9.6pt">'+fmt(t.tax)+'</div>'
          +'<div class="cell r last" style="height:8mm;font-weight:700;font-size:9.6pt">¥'+fmt(t.total)+'</div></div></div>'
    +'</div>'
    /* 特記事項 */
    +'<div style="margin-top:2.5mm"><div style="font-size:7.6pt;margin-bottom:.5mm">（特記事項）</div>'
      +'<div style="border:1.3px solid #2a2f37;border-radius:1.5mm;min-height:16mm;padding:2mm 3mm;font-size:8.6pt;white-space:pre-wrap">'+esc(d.notes)+'</div></div>'
    /* footer */
    +'<div style="margin-top:2.5mm;font-size:8pt;line-height:1.5"><div>'+esc(c.bank)+'</div><div>消費税　'+esc(d.taxRate)+'%</div></div>'
  +'</div>';
}

/* ============== 明細リストDOM ============== */
function itemRowHTML(it, idx, last){
  return '<div class="item'+(it.taxable?'':' nontax')+'" data-id="'+it.id+'">'
    +'<div class="r1"><div class="n"><input class="inp" data-field="name" placeholder="品名" value="'+esc(it.name)+'"></div>'
      +'<div class="nt"><input class="inp" data-field="note" placeholder="備考(交換/点検等)" value="'+esc(it.note)+'"></div></div>'
    +'<div class="fields">'
      +'<div class="fld qty"><span class="l">数量</span><input class="inp" data-field="qty" inputmode="decimal" value="'+esc(it.qty)+'"></div>'
      +'<div class="fld unit"><span class="l">単位</span><input class="inp" data-field="unit" list="units" value="'+esc(it.unit)+'"></div>'
      +'<div class="fld money"><span class="l">単価</span><input class="inp" data-field="unitPrice" inputmode="numeric" value="'+(it.unitPrice||'')+'"></div>'
      +'<div class="fld money"><span class="l">部品価格</span><input class="inp" data-field="partsPrice" inputmode="numeric" value="'+(it.partsPrice||'')+'"></div>'
      +'<div class="fld money"><span class="l">技術料</span><input class="inp" data-field="labor" inputmode="numeric" value="'+(it.labor||'')+'"></div>'
    +'</div>'
    +'<div class="ctrl"><label class="chk'+(it.taxable?'':' nontax')+'"><input type="checkbox" data-field="taxable" '+(it.taxable?'checked':'')+'>'+(it.taxable?'課税':'非課税')+'</label>'
      +'<div class="ops">'
        +'<button class="opbtn" data-act="up"'+(idx===0?' disabled':'')+'>↑</button>'
        +'<button class="opbtn" data-act="down"'+(last?' disabled':'')+'>↓</button>'
        +'<button class="opbtn delbtn" data-act="del">削除</button>'
      +'</div></div></div>';
}
function rebuildItems(){
  var el=$('itemsList');
  if(state.inv.items.length===0){ el.innerHTML='<div class="empty">上のボタンか「＋ 行を追加」で明細を入れてください</div>'; return; }
  var h=''; for(var i=0;i<state.inv.items.length;i++) h+=itemRowHTML(state.inv.items[i], i, i===state.inv.items.length-1);
  el.innerHTML=h;
}

/* ============== レンダリング ============== */
function renderTotals(t){
  $('t_parts').textContent='¥'+fmt(t.parts);
  $('t_labor').textContent='¥'+fmt(t.labor);
  $('t_beforeTax').textContent='¥'+fmt(t.beforeTax);
  $('t_tax').textContent='¥'+fmt(t.tax);
  $('t_taxlabel').textContent='消費税（課税対象 ¥'+fmt(t.taxableBase)+'）';
  $('t_total').textContent='¥'+fmt(t.total)+'-';
}
function renderPreview(){
  var t=calcTotals(state.inv.items, state.inv.taxRate);
  var html=invoiceHTML(state.inv, state.company, t);
  $('previewInner').innerHTML=html;
  $('printArea').innerHTML=html;
  applyScale();
}
function applyScale(){
  var s=Math.max(0.2, Math.min(3, state.autoScale*state.zoom));
  $('previewInner').style.transform='scale('+s+')';
  $('previewSizer').style.width=(PAGE_W*s)+'px';
  $('previewSizer').style.height=(PAGE_H*s)+'px';
  $('zPct').textContent=Math.round(s*100)+'%';
}
function renderAll(){ renderTotals(calcTotals(state.inv.items, state.inv.taxRate)); renderPreview(); }

function renderCompanyView(){
  var c=state.company;
  $('companyView').innerHTML=esc(c.nameJa)+'／'+esc(c.tel)+'<br>登録番号 '+esc(c.regNo);
  $('hSub').textContent=c.nameJa;
}

/* ============== フォーム⇄状態 ============== */
function fillForm(){
  var d=state.inv, c=state.company;
  $('slipNo').value=d.slipNo; $('page').value=d.page; $('era').value=d.era;
  $('yy').value=d.year; $('mm').value=d.month; $('dd').value=d.day;
  $('customer').value=d.customer;
  $('v_reg').value=d.vehicle.reg; $('v_name').value=d.vehicle.name; $('v_model').value=d.vehicle.model;
  $('v_engine').value=d.vehicle.engine; $('v_chassis').value=d.vehicle.chassis;
  $('v_firstReg').value=d.vehicle.firstReg; $('v_mileage').value=d.vehicle.mileage;
  $('notes').value=d.notes;
  $('c_service').value=c.service; $('c_agency').value=c.agency; $('c_nameEn').value=c.nameEn;
  $('c_nameJa').value=c.nameJa; $('c_rep').value=c.rep; $('c_zip').value=c.zip;
  $('c_tel').value=c.tel; $('c_address').value=c.address; $('c_regNo').value=c.regNo;
  $('c_bank').value=c.bank; $('c_taxRate').value=c.taxRate;
  rebuildItems();
  renderCompanyView();
  renderAll();
}

/* ============== localStorage ============== */
function saveInvoice(){
  var no=String(state.inv.slipNo||'').trim();
  if(!no){ toast('伝票No.を入力してください', true); return; }
  try{
    var t=calcTotals(state.inv.items, state.inv.taxRate);
    var payload=Object.assign({}, state.inv, {savedAt:Date.now(), _total:t.total});
    localStorage.setItem(LS_INV+no, JSON.stringify(payload));
    toast('伝票No.'+no+' を保存しました');
  }catch(e){ toast('保存に失敗しました', true); }
}
function listInvoices(){
  var out=[];
  for(var i=0;i<localStorage.length;i++){ var k=localStorage.key(i);
    if(k.indexOf(LS_INV)===0){ try{ out.push(JSON.parse(localStorage.getItem(k))); }catch(e){} } }
  out.sort(function(a,b){ return (b.savedAt||0)-(a.savedAt||0); });
  return out;
}
function loadInvoice(inv){
  var copy=JSON.parse(JSON.stringify(inv)); delete copy.savedAt; delete copy._total;
  if(!copy.vehicle) copy.vehicle={reg:'',name:'',model:'',engine:'',chassis:'',firstReg:'',mileage:''};
  if(!copy.items) copy.items=[];
  copy.items=copy.items.map(function(it){ return Object.assign(blankItem(),it,{id:it.id||uid()}); });
  state.inv=copy; fillForm(); closeModal(); toast('伝票No.'+copy.slipNo+' を読込みました');
}
function deleteInvoice(no){ try{ localStorage.removeItem(LS_INV+no); openModal(); }catch(e){} }
function saveCompany(){
  try{ localStorage.setItem(LS_CO, JSON.stringify(state.company)); toast('事業者情報を保存しました'); }
  catch(e){ toast('保存に失敗しました', true); }
}
function loadCompany(){
  try{ var s=localStorage.getItem(LS_CO); if(s){ state.company=Object.assign({},DEFAULT_COMPANY,JSON.parse(s)); } }catch(e){}
}

/* ============== モーダル ============== */
function openModal(){
  var list=listInvoices(), el=$('invList');
  if(list.length===0){ el.innerHTML='<div style="color:var(--sub);font-size:13px;padding:24px 0;text-align:center">まだ保存された請求書はありません。<br>「💾 保存」で伝票No.ごとに保存できます。</div>'; }
  else{
    var h='<div class="inv-list">';
    for(var i=0;i<list.length;i++){ var v=list[i];
      h+='<div class="inv-item"><div><div class="nm">No.'+esc(v.slipNo)+'　'+(esc(v.customer)||'（無名）')+' 様</div>'
        +'<div class="mt">'+esc(v.era)+esc(v.year)+'年'+esc(v.month)+'月'+esc(v.day)+'日　/　'+(esc(v.vehicle&&v.vehicle.name)||'車名なし')+'　/　¥'+fmt(v._total||0)+'</div></div>'
        +'<div class="acts"><button class="btn btn-primary" data-load="'+esc(v.slipNo)+'">読込</button>'
        +'<button class="btn btn-ghost delbtn" data-del="'+esc(v.slipNo)+'">削除</button></div></div>';
    }
    h+='</div>'; el.innerHTML=h;
  }
  $('overlay').style.display='grid';
}
function closeModal(){ $('overlay').style.display='none'; }

/* ============== トースト ============== */
var toastTimer=null;
function toast(msg, isErr){
  var el=$('toast'); el.textContent=msg; el.className='toast show'+(isErr?' err':'');
  clearTimeout(toastTimer); toastTimer=setTimeout(function(){ el.className='toast'+(isErr?' err':''); }, 2200);
}

/* ============== イベント ============== */
function bind(){
  // presets
  var pv=$('presets');
  PRESETS.forEach(function(p){
    var b=document.createElement('button');
    b.className='preset'+(p[3]?'':' nontax'); b.textContent=p[0];
    b.onclick=function(){ state.inv.items.push(blankItem({name:p[1],note:p[2],taxable:p[3]})); rebuildItems(); renderAll(); };
    pv.appendChild(b);
  });

  // simple fields -> state
  function f(id, set){ $(id).addEventListener('input', function(e){ set(e.target.value); renderAll(); }); }
  f('slipNo', function(v){ state.inv.slipNo=v; });
  f('page', function(v){ state.inv.page=v; });
  $('era').addEventListener('change', function(e){ state.inv.era=e.target.value; renderAll(); });
  f('yy', function(v){ state.inv.year=num(v); });
  f('mm', function(v){ state.inv.month=num(v); });
  f('dd', function(v){ state.inv.day=num(v); });
  f('customer', function(v){ state.inv.customer=v; });
  f('v_reg', function(v){ state.inv.vehicle.reg=v; });
  f('v_name', function(v){ state.inv.vehicle.name=v; });
  f('v_model', function(v){ state.inv.vehicle.model=v; });
  f('v_engine', function(v){ state.inv.vehicle.engine=v; });
  f('v_chassis', function(v){ state.inv.vehicle.chassis=v; });
  f('v_firstReg', function(v){ state.inv.vehicle.firstReg=v; });
  f('v_mileage', function(v){ state.inv.vehicle.mileage=v; });
  f('notes', function(v){ state.inv.notes=v; });

  // company fields
  function cf(id, key){ $(id).addEventListener('input', function(e){ state.company[key]=e.target.value; renderCompanyView(); renderPreview(); }); }
  cf('c_service','service'); cf('c_agency','agency'); cf('c_nameEn','nameEn'); cf('c_nameJa','nameJa');
  cf('c_rep','rep'); cf('c_zip','zip'); cf('c_tel','tel'); cf('c_address','address'); cf('c_regNo','regNo'); cf('c_bank','bank');
  $('c_taxRate').addEventListener('input', function(e){ var r=num(e.target.value); state.company.taxRate=r; state.inv.taxRate=r; renderAll(); });

  // items delegation
  var list=$('itemsList');
  list.addEventListener('input', function(e){
    var t=e.target, field=t.getAttribute('data-field'); if(!field) return;
    var row=t.closest('[data-id]'); var id=row.getAttribute('data-id');
    var it=null; for(var i=0;i<state.inv.items.length;i++){ if(state.inv.items[i].id===id){ it=state.inv.items[i]; break; } }
    if(!it) return;
    if(field==='qty'){ it.qty=t.value; it.partsPrice=Math.round(num(it.qty)*num(it.unitPrice)); var pp=row.querySelector('[data-field="partsPrice"]'); if(pp) pp.value=it.partsPrice||''; }
    else if(field==='unitPrice'){ it.unitPrice=num(t.value); it.partsPrice=Math.round(num(it.qty)*num(it.unitPrice)); var pp2=row.querySelector('[data-field="partsPrice"]'); if(pp2) pp2.value=it.partsPrice||''; }
    else if(field==='partsPrice'){ it.partsPrice=num(t.value); }
    else if(field==='labor'){ it.labor=num(t.value); }
    else if(field==='unit'){ it.unit=t.value; }
    else if(field==='note'){ it.note=t.value; }
    else if(field==='name'){ it.name=t.value; }
    renderAll();
  });
  list.addEventListener('change', function(e){
    if(e.target.getAttribute('data-field')!=='taxable') return;
    var row=e.target.closest('[data-id]'); var id=row.getAttribute('data-id');
    for(var i=0;i<state.inv.items.length;i++){ if(state.inv.items[i].id===id){
      state.inv.items[i].taxable=e.target.checked;
      row.classList.toggle('nontax', !e.target.checked);
      var lab=row.querySelector('.chk'); lab.classList.toggle('nontax', !e.target.checked);
      lab.childNodes[1].nodeValue=e.target.checked?'課税':'非課税';
      break;
    }}
    renderAll();
  });
  list.addEventListener('click', function(e){
    var b=e.target.closest('[data-act]'); if(!b) return;
    var row=b.closest('[data-id]'); var id=row.getAttribute('data-id');
    var idx=-1; for(var i=0;i<state.inv.items.length;i++){ if(state.inv.items[i].id===id){ idx=i; break; } }
    if(idx<0) return;
    var act=b.getAttribute('data-act');
    if(act==='del'){ state.inv.items.splice(idx,1); }
    else if(act==='up' && idx>0){ var x=state.inv.items[idx-1]; state.inv.items[idx-1]=state.inv.items[idx]; state.inv.items[idx]=x; }
    else if(act==='down' && idx<state.inv.items.length-1){ var y=state.inv.items[idx+1]; state.inv.items[idx+1]=state.inv.items[idx]; state.inv.items[idx]=y; }
    rebuildItems(); renderAll();
  });

  $('btnAdd').onclick=function(){ state.inv.items.push(blankItem()); rebuildItems(); renderAll(); };

  // header actions
  $('btnNew').onclick=function(){
    var n=num(state.inv.slipNo)?String(num(state.inv.slipNo)+1):'';
    var tr=todayReiwa();
    state.inv={ slipNo:n, page:'1/1', era:tr.era, year:tr.year, month:tr.month, day:tr.day,
      customer:'', vehicle:{reg:'',name:'',model:'',engine:'',chassis:'',firstReg:'',mileage:''},
      taxRate:state.company.taxRate||10, notes:'', items:[] };
    fillForm(); toast('新規作成しました');
  };
  $('btnSave').onclick=saveInvoice;
  $('btnList').onclick=openModal;
  $('btnCloseModal').onclick=closeModal;
  $('overlay').addEventListener('click', function(e){ if(e.target===$('overlay')) closeModal(); });
  $('invList').addEventListener('click', function(e){
    var l=e.target.closest('[data-load]'); var d=e.target.closest('[data-del]');
    if(l){ var no=l.getAttribute('data-load'); var arr=listInvoices(); for(var i=0;i<arr.length;i++){ if(String(arr[i].slipNo)===no){ loadInvoice(arr[i]); return; } } }
    if(d){ deleteInvoice(d.getAttribute('data-del')); }
  });
  $('btnPrint').onclick=function(){ window.print(); };
  $('btnPrint2').onclick=function(){ window.print(); };
  $('btnSaveCompany').onclick=saveCompany;

  // company toggle
  $('btnCompanyToggle').onclick=function(){
    var ed=$('companyEdit'), vw=$('companyView');
    if(ed.style.display==='none'){ ed.style.display='flex'; vw.style.display='none'; this.textContent='閉じる'; }
    else{ ed.style.display='none'; vw.style.display='block'; this.textContent='編集'; }
  };

  // tabs
  var main=$('main');
  document.querySelectorAll('.tabbar .tab').forEach(function(tb){
    tb.onclick=function(){
      document.querySelectorAll('.tabbar .tab').forEach(function(x){ x.classList.remove('active'); });
      tb.classList.add('active'); main.setAttribute('data-tab', tb.getAttribute('data-tab'));
      setTimeout(measureScale, 30);
    };
  });

  // zoom
  $('zOut').onclick=function(){ state.zoom=Math.max(0.5, +(state.zoom-0.15).toFixed(2)); applyScale(); };
  $('zIn').onclick=function(){ state.zoom=Math.min(3, +(state.zoom+0.15).toFixed(2)); applyScale(); };
  $('zFit').onclick=function(){ state.zoom=1; applyScale(); };
}

/* ============== スケール計測 ============== */
function measureScale(){
  var el=$('panelPreview'); if(!el) return;
  var w=el.clientWidth; if(w<=0) return;
  state.autoScale=Math.min(1, (w-36)/PAGE_W);
  applyScale();
}

/* ============== 初期化 ============== */
(function init(){
  loadCompany();
  bind();
  fillForm();
  measureScale();
  if(window.ResizeObserver){ new ResizeObserver(measureScale).observe($('panelPreview')); }
  window.addEventListener('resize', measureScale);
  window.addEventListener('orientationchange', function(){ setTimeout(measureScale,200); });
})();
</script>
